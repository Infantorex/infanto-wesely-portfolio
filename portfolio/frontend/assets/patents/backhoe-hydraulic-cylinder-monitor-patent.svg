    <path d="M 260,202 L 390,202" fill="none" stroke="#D97745" stroke-width="2"/>
    <path d="M 260,302 L 390,234" fill="none" stroke="#D97745" stroke-width="2"/>

    <!-- Central Processing Unit (Middle) -->
    <g transform="translate(390, 95)">
