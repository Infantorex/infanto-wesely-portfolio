<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&amp;family=Space+Mono:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .title { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; fill: #FFFFFF; letter-spacing: 1px; }
      .subtitle { font-family: 'Space Mono', monospace; font-size: 11px; fill: #0A84FF; letter-spacing: 1.5px; }
      .box-title { font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 700; fill: #FFFFFF; }
      .box-desc { font-family: 'Inter', sans-serif; font-size: 11px; fill: #A0AEC0; line-height: 1.45; }
      .tag { font-family: 'Space Mono', monospace; font-size: 9.5px; fill: #0A84FF; font-weight: 700; }
      .tag-cyan { font-family: 'Space Mono', monospace; font-size: 9.5px; fill: #38BDF8; font-weight: 700; }
    </style>
  </defs>

  <rect width="1000" height="650" fill="#0A0C10" rx="8"/>
  <rect x="2" y="2" width="996" height="646" fill="none" stroke="#1E232F" stroke-width="1.5" rx="7"/>

  <!-- Background Grid -->
  <g stroke="#141822" stroke-width="1">
    <line x1="50" y1="50" x2="950" y2="50"/>
    <line x1="50" y1="180" x2="950" y2="180"/>
    <line x1="50" y1="410" x2="950" y2="410"/>
    <line x1="50" y1="570" x2="950" y2="570"/>
  </g>

  <!-- Header -->
  <g transform="translate(60, 50)">
    <text x="0" y="0" class="subtitle">INFANTO WESELY R // PUBLISHED INDIAN PATENT APPLICATION</text>
    <text x="0" y="32" class="title">BACKHOE HYDRAULIC CYLINDER MONITOR — SYSTEM ARCHITECTURE</text>
    <text x="0" y="55" font-family="'Inter', sans-serif" font-size="12" fill="#888888">
      The Patent Office Journal No. 45/2026 // Application No: 202641130456 A // Page 143864
    </text>

    <!-- Top Badge -->
    <rect x="660" y="5" width="220" height="30" rx="3" fill="#131926" stroke="#0A84FF" stroke-width="1"/>
    <text x="770" y="24" class="tag" text-anchor="middle">OFFICIAL PUBLISHED PATENT APP</text>
  </g>

  <!-- Flow Pipeline -->
  <g transform="translate(60, 160)">
    <!-- Stage 01: Pressure Sensing -->
    <g transform="translate(0, 0)">
      <rect width="190" height="220" fill="#11151F" stroke="#1E2738" stroke-width="1.5" rx="6"/>
      <rect x="15" y="15" width="60" height="20" rx="3" fill="#0A84FF"/>
      <text x="45" y="28" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 01</text>
      <text x="15" y="65" class="box-title">HYDRAULIC PRESSURE</text>
      <text x="15" y="90" class="box-desc">
        Piezoelectric line transducers continuously sampling dynamic hydraulic pressure spikes up to 400 bar during heavy digging cycles.
      </text>
      <line x1="15" y1="145" x2="175" y2="145" stroke="#1A2233"/>
      <text x="15" y="170" class="tag">• 400 BAR RATED</text>
      <text x="15" y="190" class="tag">• TRANSIENT SPIKE DETECT</text>
    </g>

    <path d="M 195,110 L 235,110" fill="none" stroke="#0A84FF" stroke-width="2"/>

    <!-- Stage 02: Thermal & Fluid Level -->
    <g transform="translate(240, 0)">
      <rect width="190" height="220" fill="#11151F" stroke="#1E2738" stroke-width="1.5" rx="6"/>
      <rect x="15" y="15" width="60" height="20" rx="3" fill="#152136" stroke="#38BDF8" stroke-width="1"/>
      <text x="45" y="28" class="tag-cyan" text-anchor="middle">STAGE 02</text>
      <text x="15" y="65" class="box-title">THERMAL &amp; OIL LEVEL</text>
      <text x="15" y="90" class="box-desc">
        Integrated RTD temperature sensor and continuous optical reservoir fluid-level monitor to catch thermal breakdown and pump cavitation.
      </text>
      <line x1="15" y1="145" x2="175" y2="145" stroke="#1A2233"/>
      <text x="15" y="170" class="tag-cyan">• PT100 RTD PROBE</text>
      <text x="15" y="190" class="tag-cyan">• ANTI-CAVITATION DETECT</text>
    </g>

    <path d="M 435,110 L 475,110" fill="none" stroke="#0A84FF" stroke-width="2"/>

    <!-- Stage 03: ESP32 Edge Core -->
    <g transform="translate(480, 0)">
      <rect width="190" height="220" fill="#11151F" stroke="#0A84FF" stroke-width="2" rx="6"/>
      <rect x="15" y="15" width="60" height="20" rx="3" fill="#0A84FF"/>
      <text x="45" y="28" font-family="'Space Mono', monospace" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">STAGE 03</text>
      <text x="15" y="65" class="box-title">ESP32 CONTROLLER</text>
      <text x="15" y="90" class="box-desc">
        Dual-core 240MHz SoC executing embedded threshold algorithms, comparing multi-channel sensor feeds against safety envelope limits.
      </text>
      <line x1="15" y1="145" x2="175" y2="145" stroke="#1A2233"/>
      <text x="15" y="170" class="tag">• EMBEDDED ALGORITHM</text>
      <text x="15" y="190" class="tag">• MULTI-STAGE ESCALATION</text>
    </g>

    <path d="M 675,110 L 715,110" fill="none" stroke="#0A84FF" stroke-width="2"/>

    <!-- Stage 04: Cabin HUD & Alert -->
    <g transform="translate(720, 0)">
      <rect width="190" height="220" fill="#11151F" stroke="#1E2738" stroke-width="1.5" rx="6"/>
      <rect x="15" y="15" width="60" height="20" rx="3" fill="#152136" stroke="#0A84FF" stroke-width="1"/>
      <text x="45" y="28" class="tag" text-anchor="middle">STAGE 04</text>
      <text x="15" y="65" class="box-title">CABIN HUD &amp; TELEMETRY</text>
      <text x="15" y="90" class="box-desc">
        In-cabin visual OLED and audible warning alarms alerting equipment operator instantly, with wireless telemetry logging to fleet portal.
      </text>
      <line x1="15" y1="145" x2="175" y2="145" stroke="#1A2233"/>
      <text x="15" y="170" class="tag">• AUDIO-VISUAL ALERT</text>
      <text x="15" y="190" class="tag">• WIRELESS TELEMETRY</text>
    </g>
  </g>

  <!-- Technical Specs Footer Bar -->
  <g transform="translate(60, 440)">
    <rect width="880" height="150" fill="#0E121A" stroke="#1E232F" stroke-width="1" rx="6"/>

    <g transform="translate(25, 25)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#0A84FF">INVENTOR RECORD</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">INFANTO WESELY REX JOHN VISUVASAM</text>
      <text x="0" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Lead Student Inventor // B.E. Mechanical Engineering, KRCT</text>
    </g>

    <g transform="translate(420, 25)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#0A84FF">GAZETTE PUBLICATION</text>
      <text x="0" y="24" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">THE PATENT OFFICE JOURNAL NO. 45/2026</text>
      <text x="0" y="44" font-family="'Inter', sans-serif" font-size="11" fill="#718096">Official Filing: 02 Nov 2026 // Published: 06 Nov 2026 // Page: 143864</text>
    </g>

    <line x1="25" y1="88" x2="855" y2="88" stroke="#1A2233"/>

    <g transform="translate(25, 115)">
      <text x="0" y="0" font-family="'Space Mono', monospace" font-size="10" fill="#38BDF8">LEGAL DISCLAIMER:</text>
      <text x="145" y="0" font-family="'Inter', sans-serif" font-size="10.5" fill="#A0AEC0">
        Officially published Indian patent application under The Patents Act, 1970. Represents a published specification, not a granted patent.
      </text>
    </g>
  </g>
</svg>
