  </text>

  <!-- Awarded Product -->
  <rect x="200" y="330" width="400" height="45" fill="#F4EFEB" stroke="#D97745" stroke-width="1.2" rx="4"/>
  <text x="400" y="358" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#D97745">
